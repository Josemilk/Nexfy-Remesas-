name: NexFy Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código y Submódulos
      uses: actions/checkout@v4
      with:
        # CRÍTICO: Esto clona el código de OsmAnd (submódulo) automáticamente
        submodules: recursive 
        fetch-depth: 0

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Otorgar permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK (Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: Subir APK generado
      uses: actions/upload-artifact@v3
      with:
        name: nexfy-app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
