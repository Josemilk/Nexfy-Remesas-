name: Build Nexfy Remesas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # INSTALL REQUIRED ANDROID COMPONENTS
      # ============================================================
      - name: Install Android SDK components
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      # ============================================================
      # FIX GRADLE WRAPPER PERMISSIONS
      # ============================================================
      - name: Fix Gradle wrapper permissions
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE WRAPPER"
          echo "=========================================="

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew no existe."
            exit 1
          fi

          chmod +x ./gradlew

          ls -l ./gradlew

          test -x ./gradlew

          echo "Gradle wrapper listo para ejecutarse."

      # ============================================================
      # JAVA CHECK
      # ============================================================
      - name: Check Java
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

      # ============================================================
      # GRADLE CHECK
      # ============================================================
      - name: Check Gradle
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          ./gradlew --version

      # ============================================================
      # GRADLE PROPERTIES
      # ============================================================
      - name: Configure Gradle properties
        run: |
          set -e

          touch gradle.properties

          if ! grep -q "^android.disallowKotlinSourceSets=" gradle.properties; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          echo "=========================================="
          echo "gradle.properties"
          echo "=========================================="

          cat gradle.properties

      # ============================================================
      # TEMPORARY R IMPORT FIX
      # ============================================================
      - name: Fix PaymentContributionDialog R import
        run: |
          set -e

          FILE="app/src/main/java/com/example/ui/components/PaymentContributionDialog.kt"

          if [ -f "$FILE" ]; then

            sed -i \
              's/import com\.example\.R/import com.aistudio.nexfyremesas.app.R/' \
              "$FILE"

            echo "Archivo corregido:"
            echo "$FILE"

            grep -n "import .*R" "$FILE" || true

          else
            echo "PaymentContributionDialog.kt no encontrado."
          fi

      # ============================================================
      # PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew --stop || true

      # ============================================================
      # RESOLVE DEPENDENCIES
      # ============================================================
      - name: Resolve dependencies
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew \
            :app:dependencies \
            --configuration armonlyLegacyDebugCompileClasspath \
            --refresh-dependencies \
            --stacktrace

      # ============================================================
      # OSMAND PROTOBUF SANITIZER
      # ============================================================
      - name: Sanitize OsmAnd protobuf classes
        run: |
          set -e

          echo "=========================================="
          echo "OSMAND PROTOBUF SANITIZER"
          echo "=========================================="

          find ~/.gradle/caches/modules-2/files-2.1/net.osmand/OsmAnd-java \
            -type f \
            -name "*.jar" \
            -print 2>/dev/null || true

          JARS=$(find ~/.gradle/caches/modules-2/files-2.1/net.osmand/OsmAnd-java \
            -type f \
            -name "*.jar" \
            2>/dev/null || true)

          if [ -n "$JARS" ]; then

            while IFS= read -r JAR; do

              if [ -f "$JAR" ]; then

                echo ""
                echo "Procesando:"
                echo "$JAR"

                TMP="${JAR}.tmp"

                rm -rf "$TMP"

                mkdir -p "$TMP"

                (
                  cd "$TMP"

                  jar xf "$JAR"

                  if [ -d "com/google/protobuf" ]; then
                    echo "Eliminando com/google/protobuf..."
                    rm -rf "com/google/protobuf"
                  fi

                  jar cf "$JAR.new" .
                )

                if [ -f "$TMP/$JAR.new" ]; then
                  mv "$TMP/$JAR.new" "$JAR"
                fi

                rm -rf "$TMP"

              fi

            done <<< "$JARS"

          else
            echo "No se encontraron JARs de OsmAnd-java."
          fi

      # ============================================================
      # CLEAN
      # ============================================================
      - name: Clean project
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean --stacktrace

      # ============================================================
      # LIST GRADLE TASKS
      # ============================================================
      - name: Check Gradle tasks
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew :app:tasks --all --stacktrace

      # ============================================================
      # BUILD DEBUG APK
      # ============================================================
      - name: Build Debug APK
        run: |
          set -e

          chmod +x ./gradlew

          echo "=========================================="
          echo "BUILD DEBUG APK"
          echo "=========================================="

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --info \
            --no-daemon

      # ============================================================
      # SHOW APK
      # ============================================================
      - name: Find generated APK
        if: always()
        run: |
          echo "=========================================="
          echo "GENERATED APK FILES"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

      # ============================================================
      # UPLOAD APK
      # ============================================================
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-Remesas-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
