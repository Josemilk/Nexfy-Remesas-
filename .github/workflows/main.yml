name: Build Nexfy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Force Gradle 8.9 - Fix armonlyLegacy bug
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Clean deprecated properties
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          cat gradle.properties

      - name: Setup Gradle Action with 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Stop daemons and clean
        run: |
          ./gradlew --stop
          ./gradlew clean --no-daemon --refresh-dependencies

      - name: Build Nexfy Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 10

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 10
