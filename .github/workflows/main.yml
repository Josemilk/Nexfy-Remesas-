name: Build Nexfy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix Gradle Wrapper to 8.9
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Downgrade AGP 9.1.1 -> 8.7.3 to fix your build
        run: |
          echo "--- ANTES ---"
          head -n 10 app/build.gradle.kts
          # Cambia AGP 9.1.1 por 8.7.3
          sed -i "s/version: '9.1.1'/version: '8.7.3'/g" app/build.gradle.kts
          sed -i 's/version = "9.1.1"/version = "8.7.3"/g' app/build.gradle.kts
          sed -i "s/id(\"com.android.application\") version \"9.1.1\"/id(\"com.android.application\") version \"8.7.3\"/g" app/build.gradle.kts
          sed -i "s/id(\"com.android.library\") version \"9.1.1\"/id(\"com.android.library\") version \"8.7.3\"/g" app/build.gradle.kts
          
          # Tambien arregla si esta en libs.versions.toml
          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/9.1.1/8.7.3/g' gradle/libs.versions.toml || true
          fi
          # Arregla Kotlin para que sea compatible con AGP 8.7.3
          sed -i "s/2.0.20/1.9.22/g" app/build.gradle.kts || true
          
          echo "--- DESPUES ---"
          head -n 10 app/build.gradle.kts

      - name: Clean gradle.properties
        run: |
          sed -i '/android.enableJetifier/d' gradle.properties || true
          sed -i '/android.disallowKotlinSourceSets/d' gradle.properties || true
          echo "android.useAndroidX=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant permission
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --no-daemon --refresh-dependencies

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
