name: Build Nexfy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix Gradle Wrapper to 8.9
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Fix build.gradle.kts for AGP 8.7.3 + Kotlin 1.9.22
        run: |
          python3 << 'PY'
          import pathlib
          path = pathlib.Path("app/build.gradle.kts")
          text = path.read_text()

          # 1. Bajar AGP 9.1.1 -> 8.7.3
          text = text.replace('9.1.1', '8.7.3')
          # 2. Bajar Kotlin 2.x -> 1.9.22 si existe
          text = text.replace('2.0.20', '1.9.22').replace('2.0.21', '1.9.22').replace('2.0.0', '1.9.22')

          # 3. FIX del error de linea 92 - reemplazar bloque kotlin { compilerOptions }
          # Borra el bloque problematico de Kotlin 2.0
          import re
          # Reemplaza kotlin { compilerOptions { jvmTarget.set(...) } }
          pattern = r"kotlin\s*\{\s*compilerOptions\s*\{\s*jvmTarget\.set\(.*?\)\s*\}\s*\}"
          replacement = 'android {\n    // fixed by workflow\n}\n// kotlin block removed, using kotlinOptions below'
          text = re.sub(pattern, '', text, flags=re.DOTALL)

          # 4. Asegura que exista kotlinOptions dentro de android
          if 'kotlinOptions' not in text:
              # Inserta kotlinOptions antes del ultimo } de android
              text = text.replace('compileSdk', 'kotlinOptions {\n            jvmTarget = "17"\n        }\n        compileSdk', 1) if 'kotlinOptions' not in text else text
              # fallback: si no encontro compileSdk, lo agrega en buildTypes
              if 'kotlinOptions' not in text and 'buildTypes' in text:
                  text = text.replace('buildTypes', 'kotlinOptions {\n            jvmTarget = "17"\n        }\n        buildTypes')

          # 5. Tambien asegurar java 17
          if 'jvmTarget = "17"' not in text:
              text += '\nandroid { kotlinOptions { jvmTarget = "17" } }\n'

          path.write_text(text)
          print(text[:2000])
          PY

      - name: Clean properties
        run: |
          sed -i '/android.enableJetifier/d' gradle.properties || true
          sed -i '/android.disallowKotlinSourceSets/d' gradle.properties || true
          sed -i '/android.nonFinalResIds/d' gradle.properties || true
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Grant permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
