name: Fix Kotlin Compiler Options

on:
  push:
    paths:
      - 'app/build.gradle.kts'
      - '**/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - '**/libs.versions.toml'
  workflow_dispatch:   # puedes lanzarlo manualmente

jobs:
  diagnose-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necesario si quieres que haga commit automático

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Diagnose Kotlin configuration
        id: diagnose
        run: |
          echo "=== 1. Plugins en app/build.gradle.kts ==="
          grep -A 20 "plugins {" app/build.gradle.kts || true
          
          echo ""
          echo "=== 2. Bloque problemático (líneas \~85-110) ==="
          sed -n '85,110p' app/build.gradle.kts || true
          
          echo ""
          echo "=== 3. Versión de Kotlin ==="
          if [ -f gradle/libs.versions.toml ]; then
            grep -E "kotlin|agp" gradle/libs.versions.toml || true
          else
            echo "No se encontró libs.versions.toml"
            grep -r "kotlin" --include="*.gradle.kts" . | head -20 || true
          fi
          
          echo ""
          echo "=== 4. ¿Existe el plugin org.jetbrains.kotlin.android? ==="
          if grep -q 'org.jetbrains.kotlin.android\|kotlin("android")\|id("kotlin-android")' app/build.gradle.kts; then
            echo "✅ Plugin Kotlin Android encontrado"
            echo "has_kotlin_plugin=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Plugin Kotlin Android NO encontrado"
            echo "has_kotlin_plugin=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply automatic fix
        run: |
          FILE="app/build.gradle.kts"
          
          # 1. Si no tiene el plugin, lo agregamos (caso más común)
          if ! grep -q 'org.jetbrains.kotlin.android\|kotlin("android")' "$FILE"; then
            echo "→ Añadiendo plugin org.jetbrains.kotlin.android..."
            # Inserta el plugin justo después de com.android.application
            sed -i '/id("com.android.application")/a\    id("org.jetbrains.kotlin.android")' "$FILE"
          fi

          # 2. Eliminamos el bloque moderno roto (compilerOptions) si existe
          if grep -q "compilerOptions" "$FILE"; then
            echo "→ Eliminando bloque compilerOptions roto..."
            # Borra desde "kotlin {" hasta el cierre correspondiente (simple y efectivo para este caso)
            sed -i '/^kotlin {/,/^}/d' "$FILE"
          fi

          # 3. Añadimos la configuración segura y compatible
          if ! grep -q "kotlinOptions" "$FILE"; then
            echo "→ Añadiendo kotlinOptions compatible..."
            
            # Insertamos justo antes del cierre del bloque android (o al final si no encuentra)
            cat >> "$FILE" << 'EOF'

// Configuración Kotlin añadida automáticamente por el workflow
android {
    // ... (si ya existe el bloque android, esto se duplicará → se limpia después)
}

kotlin {
    jvmToolchain(17)
}

tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
EOF
          fi

          # 4. Limpieza básica de posibles duplicados
          # (opcional: puedes mejorar esto después)

          echo ""
          echo "=== Resultado final del archivo (últimas 40 líneas) ==="
          tail -n 40 "$FILE"

      - name: Commit fix (opcional)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No hay cambios que commitear"
          else
            git add app/build.gradle.kts
            git commit -m "fix: corrige configuración de Kotlin compilerOptions

- Asegura que el plugin org.jetbrains.kotlin.android esté presente
- Elimina bloque compilerOptions inválido
- Aplica configuración compatible con Kotlin 1.9+/2.x"
            git push
            echo "✅ Fix aplicado y pusheado"
          fi

      - name: Summary
        run: |
          echo "## Resultado de la revisión" >> $GITHUB_STEP_SUMMARY
          echo "- Plugin Kotlin: ${{ steps.diagnose.outputs.has_kotlin_plugin }}" >> $GITHUB_STEP_SUMMARY
          echo "- Se intentó aplicar el fix automático" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Revisa el log del step **Apply automatic fix** para ver exactamente qué se cambió." >> $GITHUB_STEP_SUMMARY
