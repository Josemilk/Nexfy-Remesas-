name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Reparar wrapper y firma
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Esto borra tu firma rota y pone la debug buena
          sed -i 's/signingConfigs.getByName("debugConfig")/signingConfigs.getByName("debug")/g' app/build.gradle.kts
          sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/signingConfig = signingConfigs.getByName("debug")/g' app/build.gradle.kts

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
