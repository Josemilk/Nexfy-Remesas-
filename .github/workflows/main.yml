name: Build Nexfy Remesas

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "27.0.12077973"
      ANDROID_CMAKE_VERSION: "3.22.1"

    steps:

      # ============================================================
      # 1. DESCARGAR EL PROYECTO
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALAR COMPONENTES ANDROID
      # ============================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;${ANDROID_CMAKE_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}"


      # ============================================================
      # 5. CONFIGURAR ANDROID SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

          echo "Android SDK configurado:"
          cat local.properties


      # ============================================================
      # 6. NO SOBRESCRIBIR GRADLE.PROPERTIES
      #
      # Solamente añade la propiedad si no existe.
      # ============================================================
      - name: Configure Gradle compatibility
        shell: bash
        run: |
          set -e

          touch gradle.properties

          if ! grep -q "^android.disallowKotlinSourceSets=" gradle.properties; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

          echo "gradle.properties:"
          cat gradle.properties


      # ============================================================
      # 7. CORREGIR IMPORT R
      # ============================================================
      - name: Fix incorrect R import
        shell: bash
        run: |
          set -e

          FILE="app/src/main/java/com/example/ui/components/PaymentContributionDialog.kt"

          if [ -f "$FILE" ]; then

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "app/src/main/java/com/example/ui/components/PaymentContributionDialog.kt"
          )

          text = path.read_text(encoding="utf-8")

          old = "import com.example.R"
          new = "import com.aistudio.nexfyremesas.app.R"

          if old in text:
              text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print("OK: import com.example.R corregido.")
          else:
              print("No se encontró import com.example.R.")
          PY

          else
            echo "El archivo no existe. Se continúa."
          fi


      # ============================================================
      # 8. VERIFICAR KOTLIN
      #
      # IMPORTANTE:
      # NO modificar kotlinOptions.
      # NO crear kotlin { compilerOptions { ... } }.
      #
      # La configuración debe estar en app/build.gradle.kts.
      # ============================================================
      - name: Verify Kotlin configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "KOTLIN VERSION"
          echo "=========================================="

          grep -n \
            'kotlin = ' \
            gradle/libs.versions.toml \
            || true

          echo
          echo "=========================================="
          echo "KOTLIN CONFIGURATION"
          echo "=========================================="

          grep -n -A12 -B5 \
            -E "kotlinOptions|compilerOptions|jvmTarget" \
            app/build.gradle.kts \
            || true


      # ============================================================
      # 9. ELIMINAR EXCLUDE INCORRECTO DE OSMAND
      # ============================================================
      - name: Remove incorrect OsmAnd protobuf exclude
        shell: bash
        run: |
          set -e

          FILE="app/build.gradle.kts"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("ERROR: app/build.gradle.kts no existe.")

          text = path.read_text(encoding="utf-8")

          original = text

          pattern = re.compile(
              r'(?ms)'
              r'(implementation\("net\.osmand:OsmAnd-java:[^"]+"\))'
              r'\s*\{\s*'
              r'exclude\s*\(\s*group\s*=\s*"com\.google\.protobuf"\s*\)'
              r'\s*\}'
          )

          text = pattern.sub(r'\1', text)

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("OK: exclude protobuf de OsmAnd eliminado.")
          else:
              print("No se encontró exclude protobuf de OsmAnd.")
          PY

          echo
          echo "OsmAnd:"
          grep -n -A5 -B3 \
            "OsmAnd-java" \
            "$FILE" \
            || true


      # ============================================================
      # 10. MOSTRAR VERSIONES DEL ENTORNO
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          ./gradlew --version

          echo
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          sdkmanager --list_installed | grep -E \
            "platforms;android-36|build-tools;36.0.0|ndk;27.0.12077973|cmake;3.22.1" \
            || true


      # ============================================================
      # 11. RESOLVER DEPENDENCIAS
      # ============================================================
      - name: Resolve Android dependencies
        shell: bash
        run: |
          set -e

          echo "Resolviendo dependencias..."

          ./gradlew \
            :app:dependencies \
            --configuration armonlyLegacyDebugCompileClasspath \
            --refresh-dependencies \
            --stacktrace


      # ============================================================
      # 12. SANITIZAR OSMAND
      # ============================================================
      - name: Sanitize OsmAnd protobuf classes
        shell: bash
        run: |
          set -e

          echo "Buscando OsmAnd-java..."

          OSMAND_JAR=""

          CACHE_ROOT="$HOME/.gradle/caches/modules-2/files-2.1/net.osmand/OsmAnd-java"

          if [ -d "$CACHE_ROOT" ]; then
            OSMAND_JAR=$(find "$CACHE_ROOT" \
              -type f \
              -name "OsmAnd-java-*.jar" \
              | head -n 1 || true)
          fi

          if [ -z "$OSMAND_JAR" ]; then
            echo "ERROR: No se encontró OsmAnd-java."

            find \
              "$HOME/.gradle/caches/modules-2/files-2.1/net.osmand" \
              -maxdepth 6 \
              -type f \
              2>/dev/null \
              | head -100 || true

            exit 1
          fi

          echo "JAR encontrado:"
          echo "$OSMAND_JAR"

          BACKUP="${OSMAND_JAR}.original"

          if [ ! -f "$BACKUP" ]; then
            cp "$OSMAND_JAR" "$BACKUP"
          fi

          TMP_DIR=$(mktemp -d)

          echo "Extrayendo OsmAnd-java..."

          cd "$TMP_DIR"

          jar xf "$OSMAND_JAR"

          if [ -d "com/google/protobuf" ]; then
            echo "Eliminando clases protobuf..."

            rm -rf "com/google/protobuf"
          else
            echo "No existe com/google/protobuf."
          fi

          echo "Reconstruyendo JAR..."

          rm -f "$OSMAND_JAR"

          jar cf "$OSMAND_JAR" .

          cd -

          rm -rf "$TMP_DIR"

          echo
          echo "Verificando OsmAnd-java..."

          if jar tf "$OSMAND_JAR" \
              | grep -q "^com/google/protobuf/"; then

            echo "ERROR: todavía existen clases protobuf."
            exit 1

          else

            echo "OK: no quedan clases protobuf dentro de OsmAnd-java."

          fi


      # ============================================================
      # 13. LIMPIAR PROYECTO
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          ./gradlew clean --stacktrace


      # ============================================================
      # 14. MOSTRAR VARIANTES
      # ============================================================
      - name: Show Android build variants
        shell: bash
        run: |
          set -e

          ./gradlew :app:tasks --all \
            | grep -E \
              "assemble.*Debug|assemble.*Release" \
            || true


      # ============================================================
      # 15. COMPILAR APK DEBUG
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "COMPILANDO NEXFY REMESAS"
          echo "=========================================="

          ./gradlew assembleDebug \
            --stacktrace \
            --info


      # ============================================================
      # 16. BUSCAR APK
      # ============================================================
      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK ENCONTRADOS"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null \
            || true


      # ============================================================
      # 17. SUBIR APK
      # ============================================================
      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nexfy-Remesas-APKs
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14


      # ============================================================
      # 18. RESUMEN FINAL
      # ============================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "          NEXFY REMESAS BUILD"
          echo "=============================================="
          echo

          if [ -d "app/build/outputs/apk" ]; then

            echo "APKs generados:"

            find app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -exec ls -lh {} \; \
              2>/dev/null \
              || true

          else

            echo "No existe app/build/outputs/apk."

          fi

          echo
          echo "Los cambios realizados por este workflow"
          echo "son temporales dentro del runner."
          echo "No se realiza commit ni push."
          echo
